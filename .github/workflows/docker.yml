name: Docker

# Publishes aritzmmartinez/quoin on a version tag (v0.11.0 → 0.11.0, 0.11, latest).
# Nothing else publishes: a release is a tag, and the tag comes after the release
# commit, so the image always matches a version the changelog describes.
#
# A pull request touching anything the image is built from runs the same builds
# and the same Docker Scout scan without pushing, and the Docker Hub login, so a
# broken pipeline or a fixable CVE shows up on the PR and not on the tag. That
# includes package.json: moving `prisma` or `tsx` back to devDependencies still
# builds, and breaks the image only at start.
#
# This is also what validates Dependabot's PRs: each bumps one of these paths.
# They run with Dependabot's secrets, not the repository's, so DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN there hold a read-only Docker Hub token, never the
# publishing one. Read-only is enough for the scan; only a tag pushes.
#
# Each platform builds on its own native runner. arm64 under QEMU on an amd64 runner
# took over 25 minutes, nearly all of it `vite build`; natively it takes as long as
# amd64. On a tag, each build pushes by digest and `merge` joins the two digests
# into one multi-arch manifest under the version tags.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - db-backup.sh
      - scripts/db-backup.ts
      - scripts/lib/db-target.ts
      - scripts/lib/backup-names.ts
      - scripts/lib/backup-verify.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - prisma/**
      - .github/workflows/docker.yml

env:
  IMAGE: aritzmmartinez/quoin
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: quoin:scan
          load: true
          provenance: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://quoin:scan
          platform: ${{ matrix.platform }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          write-comment: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
